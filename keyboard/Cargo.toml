[package]
name = "toros-keyboard"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "torOS on-screen keyboard for the pointer, after Apple's"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9" }
gtk4-layer-shell = "0.8"
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }

[build-dependencies]
glib-build-tools = "0.22"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

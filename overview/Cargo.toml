[package]
name = "toros-overview"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "torOS overview: the open windows, the applications and a search, on the Super key"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
gtk4-layer-shell = "0.8"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[build-dependencies]
glib-build-tools = "0.22"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

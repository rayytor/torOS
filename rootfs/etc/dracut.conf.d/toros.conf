# Generic initramfs so the same image boots from USB, the eMMC and QEMU.
# Replaced by a no-initramfs custom kernel in phase 5.
hostonly="no"
compress="zstd"
add_drivers+=" mmc_block sdhci_pci cqhci usb_storage uas xhci_pci virtio_blk virtio_pci virtio_scsi "
omit_dracutmodules+=" drm kernel-network-modules lvm mdraid dmraid crypt btrfs multipath iscsi nfs network network-legacy plymouth "

[General]
EnableNetworkConfiguration=true

[Network]
NameResolvingService=resolvconf

# Use the kernel's own wlan0 instead of deleting and re-creating the interface.
# Together with net.ifnames=0 on the kernel command line this stops the
# create/rename churn during which iwd crashed in a loop on the laptop.
[DriverQuirks]
DefaultInterface=*

# Kernel command line of the recovery boot entry (Void's kernel with an
# initramfs), used by /etc/kernel.d/post-install/60-toros-boot. Messages are
# shown on purpose. The torOS kernel's own command line is built into it
# (kernel/fragment).
CMDLINE="root=LABEL=torOS rootfstype=ext4 rw loglevel=4 net.ifnames=0"

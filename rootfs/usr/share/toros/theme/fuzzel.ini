# torOS launcher: the same surface, corners and font as menus and notifications.
# Template: toros-theme fills in the colours from /usr/share/toros/palette and
# writes the result to ~/.config/fuzzel/fuzzel.ini.
[main]
font=Inter:size=12
icon-theme=Adwaita
lines=10
width=34
horizontal-pad=18
vertical-pad=14
inner-pad=8

[colors]
background=@popover@ff
text=@fg@ff
prompt=@dim@ff
placeholder=@dim@ff
input=@fg@ff
match=@accent_text@ff
selection=@select@ff
selection-text=@fg@ff
selection-match=@accent_text@ff
border=@border@ff

[border]
width=1
radius=16

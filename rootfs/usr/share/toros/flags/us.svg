    <rect y="8.571" width="20" height="2.143" fill="#b22234"/>
    <rect y="12.857" width="20" height="2.143" fill="#b22234"/>
    <rect width="9" height="8.571" fill="#3c3b6e"/>
    <circle cx="2" cy="1.75" r="0.62" fill="#fff"/>
    <circle cx="4.5" cy="1.75" r="0.62" fill="#fff"/>
    <circle cx="7" cy="1.75" r="0.62" fill="#fff"/>
    <circle cx="3.25" cy="4.29" r="0.62" fill="#fff"/>
    <circle cx="5.75" cy="4.29" r="0.62" fill="#fff"/>
    <circle cx="2" cy="6.83" r="0.62" fill="#fff"/>
    <circle cx="4.5" cy="6.83" r="0.62" fill="#fff"/>
    <circle cx="7" cy="6.83" r="0.62" fill="#fff"/>
  </g>
  <rect x="0.5" y="0.5" width="19" height="14" rx="2.5" fill="none" stroke="#000" stroke-opacity="0.18"/>

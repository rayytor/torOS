  <path d="m14 88c26-7 46-5 62 0s28 2 38-3v13h-100z" fill="#26a269"/>
  <!-- everything but the marked area is dimmed -->
  <path d="m14 24h100v74h-100zm16 12v50h68v-50z" fill="#241f31" fill-opacity=".4" fill-rule="evenodd"/>
 </g>
 <!-- the marked area's corners -->
 <path d="m30 49v-13h13m42 0h13v13m0 24v13h-13m-42 0h-13v-13" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

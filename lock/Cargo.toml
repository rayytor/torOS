[package]
name = "toros-lock"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "torOS lock screen: the clock, then the account's password"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
gtk4-session-lock = { version = "0.4", features = ["v1_2"] }
libc = "0.2"

[build-dependencies]
glib-build-tools = "0.22"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
